 contaminate food, and transmit disease",dangerLevel:"High",peakSeason:"Fall & Winter Attic Invasions (Seeking warmth and food)",symptoms:["Scratching, scurrying, or thumping sounds in ceilings and attics at night","Dark cylindrical droppings (1/4 to 3/4 inch) near pantry and pipes","Gnaw marks on wooden baseboards, plastic plumbing, and electrical wires","Greasy rub marks along baseboard corners and crawl space openings"],identificationTips:["Rats can squeeze through a hole the size of a quarter; mice through a dime","Require continuous gnawing to prevent teeth from overgrowing","High risk of house fires from chewed insulation on electrical wiring"],treatmentSummary:"Comprehensive Attic & Crawl Space Inspection, Snap-trap sanitation stations, Complete Structural Exclusion (sealing entry holes with copper mesh & heavy-gauge steel), plus sanitized cleanup.",diyWarning:"Over-the-counter rodent poisons cause rodents to die inside inaccessible wall voids, producing nauseating decomposition odors that linger for weeks.",imageUrl:"https://images.unsplash.com/photo-1548767797-d8c844163c4c?auto=format&fit=crop&w=800&q=80"},{id:"squirrels-raccoons",name:"Attic Wildlife (Squirrels & Raccoons)",category:"wildlife-rodents",tagline:"Destructive attic nesters requiring Georgia-licensed humane relocation",dangerLevel:"Moderate",peakSeason:"Late Winter & Spring (Nesting and birthing seasons)",symptoms:["Loud scampering, rolling acorns, or vocal chattering during early dawn","Torn soffit screens, chewed fascia boards, and damaged ridge vents","Trod-down, contaminated attic blown-in fiberglass insulation","Foul urine or fecal odors permeating upper bedroom ceilings"],identificationTips:["Gray squirrels active during daytime; flying squirrels and raccoons at night","Raccoons can easily rip through rotten shingles and roof vents"],treatmentSummary:"100% Humane Live-Trapping, Safe Forest Relocation 15+ Miles Away, 1-Way Exclusion Doors, and Heavy-Duty Metal Roof/Soffit Reinforcement.",d
