ng",question:"Do you offer free estimates and what is included in your re-treatment guarantee?",answer:"Yes! All standard property inspections and cost consultations are 100% free with no obligation. On our quarterly protection plans, if you spot target pests between scheduled service appointments, a licensed technician will return to your home to re-treat the area at zero additional cost."},{category:"General",question:"How quickly can a First Choice technician arrive at my home or business in Decatur/Atlanta?",answer:"We provide same-day or next-day scheduled appointments across Decatur, DeKalb County, Fulton County, and within our 25-mile radius. For acute emergencies (wasp swarms, active rodent infiltrations, or locked wildlife in living spaces), we offer priority expedited dispatch."},{category:"Safety",question:"What humane methods do you use for attic wildlife like squirrels or raccoons?",answer:"We adhere strictly to Georgia Department of Natural Resources (DNR) wildlife guidelines. We utilize humane live-catch cage traps, check them regularly, ensure no orphaned young remain in the attic, and safely relocate the animals to natural wooded habitats 15+ miles away before permanently sealing entry points with heavy-gauge steel mesh."}],ip=()=>{const[v,g]=K.useState(0),[z,o]=K.useState("All"),D=["All","Safety","Termites","Bed Bugs","Pricing","General"],E=np.filter(L=>z==="All"?!0:L.category===z),k=L=>{g(v===L?null:L)};return n.jsx("section",{id:"faq",className:"py-16 bg-white text-slate-900 border-t border-slate-200",children:n.jsxs("div",{className:"max-w-5xl mx-auto px-4 sm:px-6 lg:px-8",children:[n.jsxs("div",{className:"max-w-3xl mx-auto text-center mb-10",children:[n.jsxs("div",{className:"inline-flex items-center gap-1.5 px-3.5 py-1.5 rounded-full bg-blue-100 text-[#1D3B8B] text-xs font-black uppercase tracking-wider mb-3 border border-blue-200",children:[n.jsx(M0,{className:"w-3.5 h-3.5 text-[#D9252A]"}),n.jsx("span",{children:"Clear Answers & Guarantees"
